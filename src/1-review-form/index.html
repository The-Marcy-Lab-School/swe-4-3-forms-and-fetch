<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Reviews - Part 1</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review System</h1>
    <p>Share your product reviews with the world!</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Submit a Review</h2>
      <form id="review-form">
        <div class="form-field">
          <label for="product-name">Product Name</label>
          <input
            type="text"
            id="product-name"
            name="productName"
            required
            placeholder="e.g., Wireless Headphones"
          >
        </div>

        <div class="form-field">
          <label for="reviewer-name">Your Name</label>
          <input
            type="text"
            id="reviewer-name"
            name="reviewerName"
            required
            placeholder="e.g., Jane Doe"
          >
        </div>

        <div class="form-field">
          <label for="rating">Rating (1-5)</label>
          <input
            type="number"
            id="rating"
            name="rating"
            min="1"
            max="5"
            required
          >
        </div>

        <div class="form-field">
          <label for="review-text">Your Review</label>
          <textarea
            id="review-text"
            name="reviewText"
            rows="5"
            required
            placeholder="Tell us about your experience..."
          ></textarea>
        </div>

        <div class="checkbox-field">
          <input
            type="checkbox"
            id="recommend"
            name="recommend"
          >
          <label for="recommend">I would recommend this product</label>
        </div>

        <button type="submit">Submit Review</button>
      </form>
    </section>

    <section class="reviews-section">
      <h2>Recent Reviews</h2>
      <ul id="reviews-list">
        <!-- Reviews will be added here dynamically -->
      </ul>
    </section>
  </main>
</body>
</html>
